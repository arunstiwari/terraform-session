upstream service1 {
    server 127.0.0.1:8080
}

upstream service2 {
    server 127.0.0.1:9090
}

upstream service3 {
    server 127.0.0.1:7070
}


server {
    listen 80;
    location /service1/ {
        proxy_pass http://service1/;
    }
    location /service3/ {
        proxy_pass http://service3/;
    }
}
