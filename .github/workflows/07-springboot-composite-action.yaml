name: Spring Boot Composite Action
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Spring Boot action setup
        id: springboot-action-setup
        uses: ./.github/actions/springboot-action-setup
        with:
          java-version: ${{ matrix.java-version }}
          maven-version: '3.9.16'
          working-directory: springboot-app
          coverage-minimum: '0.80'
          # Dependencies are identical across JDKs, so scan only once
          run-trivy: ${{ matrix.java-version == '21' }}

      - name: Print outputs
        run: |
          echo "Java: $JAVA_VERSION"
          echo "Maven: $MAVEN_VERSION"
          echo "Line coverage: $COVERAGE%"
        env:
          JAVA_VERSION: ${{ steps.springboot-action-setup.outputs.java-version }}
          MAVEN_VERSION: ${{ steps.springboot-action-setup.outputs.maven-version }}
          COVERAGE: ${{ steps.springboot-action-setup.outputs.line-coverage }}
