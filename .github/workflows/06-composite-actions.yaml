
name: Composite Actions
on: workflow_dispatch

jobs:
  use-the-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: React action Setup
        id: react-action-setup
        uses: ./.github/actions/reaction-action-setup
        with:
          node-version: '24.x'
          working-directory: react-app
          doWeWantToInstallDependencies: 'false'
          
