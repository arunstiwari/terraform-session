[project]
name = "fastapi-app"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Minimum line coverage enforced by `coverage report`. Override with --fail-under=90
fail_under = 80
show_missing = true
